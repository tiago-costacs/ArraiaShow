<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arraia Show - Front</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script async src="https://esm.sh/v135/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime"
        }
      }
    </script>
    <script type="module">
      import('./src/index.js').catch(err => {
        console.error('Erro:', err);
        document.getElementById('root').innerHTML = `<div style="color: red; padding: 20px;"><h1>Erro</h1><p>${err.message}</p></div>`;
      });
    </script>
  </body>
</html>
